[package]
name = "gordian"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI and TUI for the Gordian LLM agent that designs KiCAD schematics and PCBs."

[features]
default = []
chafa = ["ratatui-image/chafa-dyn"]

[dependencies]
gordian-core = { path = "../gordian-core" }
kicad-cli = { path = "../kicad-cli" }
kicad-env = { path = "../kicad-env" }

anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
ratatui.workspace = true
crossterm.workspace = true
ratatui-image = { version = "9.0.0", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
futures.workspace = true
async-trait.workspace = true
pulldown-cmark.workspace = true

[dev-dependencies]
async-trait.workspace = true
tempfile.workspace = true
