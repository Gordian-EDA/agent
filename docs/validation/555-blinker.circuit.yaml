version: 1
name: 555-blinker
rails: [9V, GND]
blocks:
  blinker:
    components:
      U1:
        part: Timer:NE555P
        # KiCad Timer:NE555P pin names: GND(1) TR(2) Q(3) R(4) CV(5) THR(6)
        # DIS(7) VCC(8). Reset (R, pin 4) tied high to 9V.
        pins:
          VCC: 9V
          GND: GND
          TR: N_TR
          THR: N_TR
          DIS: N_DIS
          CV: N_CV
          R: 9V
          Q: N_Q
      R1: {part: Device:R, value: 4k7, between: [9V, N_DIS]}
      R2: {part: Device:R, value: 10k, between: [N_DIS, N_TR]}
      C1: {part: Device:C, value: 100u, between: [N_TR, GND]}
      C2: {part: Device:C, value: 10n, between: [N_CV, GND]}
      R3: {part: Device:R, value: 1k, between: [N_Q, N_LED]}
      D1: {part: Device:LED, value: red, pins: {K: GND, A: N_LED}}
