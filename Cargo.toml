[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Gordian-EDA/agent"
authors = ["Gordian-EDA"]
readme = "README.md"
rust-version = "1.85"

[workspace.dependencies]
kasuari = "0.4"
saphyr = "0.0.6"
saphyr-parser = "0.0.6"
indexmap = "2"
uuid = { version = "1", features = ["v4", "v5"] }
kiutils_kicad = "0.3"
kiutils_sexpr = "0.1.1"
strsim = "0.11"
fuzzy-matcher = "0.3"
rayon = "1"
elsa = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
toml = "0.8"
tempfile = "3"
libc = "0.2"
quick-xml = "0.37"
anyhow = "1"
async-trait = "0.1"
fastrand = "2"
directories = "6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
resvg = { version = "0.47", default-features = false }
base64 = "0.22"
