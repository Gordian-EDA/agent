[package]
name = "gordian-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The agent's LLM seam: the Provider trait, the genai-backed production client, and its typed LlmConfig."

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
