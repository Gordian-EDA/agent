repository.workspace = true
description = "CLI and TUI for the Gordian LLM agent that designs KiCAD schematics and PCBs."

[dependencies]
gordian-core = { path = "../gordian-core" }
llm-client = { path = "../llm-client" }
kicad-cli-rs = { path = "../kicad-cli-rs" }
kicad-sexpr = { path = "../kicad-sexpr" }

anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true
ratatui.workspace = true
crossterm.workspace = true
ratatui-image = { version = "9.0.0", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"
futures.workspace = true
async-trait.workspace = true
pulldown-cmark.workspace = true

[dev-dependencies]
async-trait.workspace = true
