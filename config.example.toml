# Gordian config. The CLI reads/writes the real file at the platform config
# path, e.g. ~/.config/gordian/config.toml on Linux (first `gordian agent` run
# creates it from these defaults).

schemaVersion = 1

[llm]
adapter = "openai"
model = "gpt-4o"
apiKey = "replace-me"
# endpoint = "https://your-openai-compatible-gateway/v1"
maxTokens = 16384
ephemeralCache = true
# reasoningEffort = "medium" # none|minimal|low|medium|high|xhigh|max|<token budget>
# captureReasoning = false
# visionCapable = true

[kicad]
# Gordian requires KiCad 10 or newer and uses only kicad-cli and saved files.
# symbolDir = "/usr/share/kicad/symbols"
# footprintDir = "/usr/share/kicad/footprints"
# cliPath = "/usr/bin/kicad-cli"

[project]
schematicFilename = "design.kicad_sch"

[agent]
budgetSeconds = 180
maxBuilds = 6
