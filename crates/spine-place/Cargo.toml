description = "Deterministic grammar-typesetting schematic placement engine: parses the netlist into net/part roles, series chains, and anchor modules, then typesets them (columns of modules, wire-first spines, corpus-mined conventions) in one deterministic pass — no stochastic search, sub-100ms placement."

