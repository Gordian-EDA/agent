[package]
name = "gordian-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Gordian schematic+PCB agent: system prompt, the seven design tools, the agent loop, the visual critic, the composition pass and the PCB stage."

[features]
# The real engines, each switched on as its crate lands. Without them the loop
# compiles against local stand-ins with the same signatures that refuse at
# runtime, so the prompt, the critic, the CLI and the budget can be tested first.
default = ["real-sch", "real-pcb"]
real-sch = ["dep:sch-engine"]
real-pcb = ["dep:pcb-auto"]

[dependencies]
gordian-llm = { path = "../gordian-llm" }
gordian-skills = { path = "../gordian-skills" }
gordian-runtime = { path = "../gordian-runtime" }
kicad = { path = "../kicad" }
sch-engine = { path = "../sch-engine", optional = true }
pcb-auto = { path = "../pcb-auto", optional = true }

anyhow.workspace = true
genai = "=0.7.0-beta.6"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true
base64.workspace = true
resvg.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
