version: 1
# Regression fixture: an N-MOSFET H-bridge. The four gate nets (HA/LA/HB/LB) are
# single-pin ports whose pins face LEFT, but their names are NOT input-ish, so the
# name heuristic alone would exit them RIGHT — onto the transistor body. The fix
# makes a single-pin port follow its pin's real direction. Guards both that and the
# short port stub that keeps the pennant clear of the next FET in a packed row.
blocks:
  main:
    components:
      Q1: {part: Transistor_FET:Q_NMOS_GSD, value: Q_NMOS_GSD, pins: {1: HA, 2: OUTA, 3: P12V}}
      Q2: {part: Transistor_FET:Q_NMOS_GSD, value: Q_NMOS_GSD, pins: {1: LA, 2: GND, 3: OUTA}}
      Q3: {part: Transistor_FET:Q_NMOS_GSD, value: Q_NMOS_GSD, pins: {1: HB, 2: OUTB, 3: P12V}}
      Q4: {part: Transistor_FET:Q_NMOS_GSD, value: Q_NMOS_GSD, pins: {1: LB, 2: GND, 3: OUTB}}
      PWR1: {part: power:+12V, pins: {1: P12V}}
      G1: {part: power:GND, pins: {1: GND}}
      G2: {part: power:GND, pins: {1: GND}}
      LBL1: {part: label:global, pins: {1: HA}}
      LBL2: {part: label:global, pins: {1: LA}}
      LBL3: {part: label:global, pins: {1: HB}}
      LBL4: {part: label:global, pins: {1: LB}}
      LBL5: {part: label:global, pins: {1: OUTA}}
      LBL6: {part: label:global, pins: {1: OUTB}}
