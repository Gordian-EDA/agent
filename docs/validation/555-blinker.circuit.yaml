version: 1
name: 555-blinker
rails: [9V, GND]
blocks:
  blinker:
    components:
      U1:
        part: Timer:NE555P
        # NE555P pin names (extends NE555D): GND(1) TRIG(2) OUT(3) ~{RST}(4)
        # CONT(5) THRES(6) DISCH(7) VCC(8). Reset tied high via pin number 4
        # to dodge the ~{RST} escape in YAML.
        pins:
          VCC: 9V
          GND: GND
          TRIG: N_TR
          THRES: N_TR
          DISCH: N_DIS
          CONT: N_CV
          "4": 9V
          OUT: N_Q
      R1: {part: Device:R, value: 4k7, between: [9V, N_DIS]}
      R2: {part: Device:R, value: 10k, between: [N_DIS, N_TR]}
      C1: {part: Device:C, value: 100u, between: [N_TR, GND]}
      C2: {part: Device:C, value: 10n, between: [N_CV, GND]}
      R3: {part: Device:R, value: 1k, between: [N_Q, N_LED]}
      D1: {part: Device:LED, value: red, between: [GND, N_LED]}
