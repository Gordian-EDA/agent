# Gordian config. The CLI/TUI persist the real file at the platform config path,
# e.g. ~/.config/gordian/config.toml on Linux.

schemaVersion = 1

[llm]
adapter = "openai"
model = "gpt-4o"
apiKey = "replace-me"
# endpoint = "https://your-openai-compatible-gateway/v1"
maxTokens = 16384
ephemeralCache = true
# reasoningEffort = "medium" # none|minimal|low|medium|high|xhigh|max|<token budget>
# captureReasoning = false

[kicad]
# symbolDir = "/usr/share/kicad/symbols"
# footprintDir = "/usr/share/kicad/footprints"
# cliPath = "/usr/bin/kicad-cli"
# pcbnewPath = "/usr/bin/pcbnew"
attachRunning = false
# Allow managed launch to enable KiCad's IPC server for the selected major.
# This is an explicit config mutation opt-in; ordinary discovery never rewrites it.
enableApiConfig = false

[project]
schematicFilename = "design.kicad_sch"

[agent]
postCommitReview = true
reviewFixRounds = 1

[review]
retryJson = false
ensemble = false
layout = true

[tools]
defaultSearchLimit = 8
renderMaxPx = 1600

[engines]
# Schematic placement implementation: cluster | anneal | spine
schematicPlacer = "cluster"
# pcbRouter: "auto" (A* + mesh selector), "astar", or "mesh"
pcbRouter = "auto"
